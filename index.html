<main>

<script>
const $ = selector => document.querySelector(selector);
const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
})[character]);

function parseCSVRows(text) {
  text = text.replace(/^\uFEFF/, '');
  const result = [];
  let row = [];
  let cell = '';
  let quoted = false;
  let closed = false;
  let line = 1;
  let startLine = 1;

  function finishRow() {
    row.push(cell);
    if (row.some(value => value.trim() !== '')) result.push({cells:row, line:startLine});
    row = [];
    cell = '';
    closed = false;
  }

  for (let i = 0; i < text.length; i++) {
    const character = text[i];
    if (quoted) {
      if (character === '"') {
        if (text[i + 1] === '"') {
          cell += '"';
          i++;
        } else {
          quoted = false;
          closed = true;
        }
      } else {
        cell += character;
        if (character === '\n') line++;
      }
    } else if (character === '"') {
      if (cell !== '' || closed) throw Error(`第 ${line} 行引号位置不正确。`);
      quoted = true;
    } else if (character === ',') {
      row.push(cell);
      cell = '';
      closed = false;
    } else if (character === '\n' || character === '\r') {
      finishRow();
      if (character === '\r' && text[i + 1] === '\n') i++;
      line++;
      startLine = line;
    } else {
      if (closed) throw Error(`第 ${line} 行闭合引号后应为逗号或换行。`);
      cell += character;
    }
  }
  if (quoted) throw Error('CSV 中存在未闭合的引号，请重新导出 CSV。');
  finishRow();
  return result;
}

function download(text, name, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const link = document.createElement('a');
  link.href = url;
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function csvEncode(values) {
  return values.map(value => '"' + String(value).replace(/"/g, '""') + '"').join(',');
}
</script>
<script>
// CSV data and edits live in this page.
function mountPerovskiteCatalog(workspace, sourceBadge) {
  const dimensions = {year:'发表年份', system:'材料体系', topic:'研究主题'};
  const fields = {
    title:'文献标题', ...dimensions, doi:'DOI', note:'备注',
    authors:'作者', venue:'出版来源', registry:'元数据来源'
  };
  const views = {overview:'概览', chart:'交叉图', papers:'文献列表'};
  const pageSize = 15;
  const filters = {year:'', system:'', topic:''};
  let catalog = [];
  let view = 'overview';
  let query = '';
  let onlyMissingDOI = false;
  let drilldown = [];
  let axisX = 'topic';
  let axisY = 'system';
  let pageIndex = 0;
  let importVersion = 0;
  let detailKey = null;

  workspace.classList.add('pv-workspace');
  workspace.setAttribute('aria-label', '钙钛矿文献工作台');
  workspace.innerHTML = `
    <div class="pv-header">
      <p class="muted">按材料体系、研究主题与年份浏览文献，点击图表中的分类查看对应条目。</p>
      <div class="pv-actions">
        <button type="button" data-pv="template">CSV 模板</button>
        <button type="button" data-pv="export" disabled>导出文献 CSV</button>
        <button type="button" data-pv="import">导入文献 CSV</button>
        <button type="button" class="primary" data-pv="lookup">按 DOI 查文献</button>
        <input id="pv-file" type="file" accept=".csv,text/csv" aria-label="选择文献 CSV" hidden>
      </div>
    </div>
    <div class="pv-nav" role="group" aria-label="文献视图">
      ${Object.entries(views).map(([key,label]) => `<button type="button" data-pv-view="${key}">${label}</button>`).join('')}
    </div>
    <div class="panel pv-filters">
      <label>搜索当前文献<input id="pv-search" type="search" placeholder="标题、作者、主题或 DOI"></label>
      ${Object.entries(dimensions).map(([key,label]) => `<label>${label}<select aria-label="${label}" data-pv-filter="${key}"></select></label>`).join('')}
      <button type="button" data-pv="clear">清除筛选</button>
    </div>
    <p id="pv-status" class="pv-status" role="status"></p>
    <div id="pv-results"></div>`;
  const dialog = document.createElement('dialog');
  dialog.className = 'pv-dialog';
  dialog.setAttribute('aria-labelledby', 'pv-detail-title');
  document.body.append(dialog);
  const lookupDialog = document.createElement('dialog');
  lookupDialog.className = 'pv-dialog';
  lookupDialog.setAttribute('aria-labelledby', 'pv-lookup-title');
  document.body.append(lookupDialog);
  let lookupTarget = null;
  let lookupResult = null;
  let lookupController = null;

  const valueOf = (paper, key) => paper[key] || '未填写';
  const compareText = (a, b) => a.localeCompare(b, 'zh-CN', {numeric:true});
  const yearsFirst = (a, b) => (b.year || '0').localeCompare(a.year || '0') || compareText(a.title, b.title);
  function normalizeDOI(input) {
    const value = input.trim().replace(/^doi:\s*/i, '');
    const link = /^https?:\/\/(?:dx\.)?doi\.org\/([^?#]+)(?:[?#].*)?$/i.exec(value);
    if (!link) return value;
    try { return decodeURIComponent(link[1]); }
    catch { return value; }
  }
  const validDOI = value => !value || /^10\.\d{4,9}\/[^\s<>"\\]+$/u.test(value);
  const doiLink = value => 'https://doi.org/' + encodeURIComponent(value).replace(/%2F/gi, '/');
  const cleanText = value => typeof value === 'string' ? value.trim() : '';
  const yearText = value => /^[12]\d{3}$/.test(String(value)) ? String(value) : '';

  const registries = [
    {
      name:'Crossref', endpoint:'https://api.crossref.org/works/',
      extract(payload) {
        const item = payload?.message;
        const date = item?.published || item?.issued || item?.['published-online'] || item?.['published-print'];
        const names = Array.isArray(item?.author) ? item.author : [];
        return {
          title:cleanText(item?.title?.[0]),
          year:yearText(date?.['date-parts']?.[0]?.[0]),
          authors:names.map(author => cleanText(author?.name) ||
            [cleanText(author?.given), cleanText(author?.family)].filter(Boolean).join(' ')).filter(Boolean).join('; '),
          venue:cleanText(item?.['container-title']?.[0]) || cleanText(item?.publisher)
        };
      }
    },
    {
      name:'DataCite', endpoint:'https://api.datacite.org/dois/',
      extract(payload) {
        const item = payload?.data?.attributes;
        const names = Array.isArray(item?.creators) ? item.creators : [];
        return {
          title:cleanText(item?.titles?.[0]?.title),
          year:yearText(item?.publicationYear),
          authors:names.map(author => cleanText(author?.name) ||
            [cleanText(author?.givenName), cleanText(author?.familyName)].filter(Boolean).join(' ')).filter(Boolean).join('; '),
          venue:cleanText(item?.container?.title) || cleanText(item?.publisher?.name) || cleanText(item?.publisher)
        };
      }
    }
  ];

  async function lookupDOI(doi, signal) {
    let unavailable = false;
    for (const registry of registries) {
      try {
        const response = await fetch(registry.endpoint + encodeURIComponent(doi), {signal, credentials:'omit'});
        if (response.status === 404) continue;
        if (!response.ok) {
          unavailable = true;
          continue;
        }
        const metadata = registry.extract(await response.json());
        if (metadata.title) return {...metadata, doi, registry:registry.name};
      } catch (error) {
        if (signal.aborted) throw error;
        unavailable = true;
      }
    }
    throw Error(unavailable
      ? '暂时无法完成查询，请检查网络后重试。'
      : 'Crossref 和 DataCite 未返回该 DOI 的题名，请核对 DOI。');
  }

  function parseCatalog(text, filename) {
    const csvRows = parseCSVRows(text);
    const headings = csvRows.shift()?.cells.map(cell => cell.trim().toLowerCase()) || [];
    const keys = headings.map(heading => Object.keys(fields).find(key =>
      heading === key || heading === fields[key].toLowerCase()
    ));
    const recognized = keys.filter(Boolean);
    if (!keys.includes('title')) throw Error('需要“文献标题”列。请先下载模板。');
    if (new Set(recognized).size !== recognized.length) throw Error('文献表头包含重复字段。');
    if (!csvRows.length || csvRows.length > 500) throw Error('每次请导入 1–500 条文献。');

    const dois = new Set();
    return csvRows.map(({cells, line}, key) => {
      if (cells.length !== headings.length) throw Error(`第 ${line} 行的列数与表头不一致。`);
      const paper = {
        ...Object.fromEntries(Object.keys(fields).map(field => [field, ''])),
        key, source:`${filename} · 第 ${line} 行`
      };
      keys.forEach((field, i) => {
        if (field) paper[field] = cells[i].trim();
      });
      if (!paper.title) throw Error(`第 ${line} 行缺少文献标题。`);
      if (paper.year && !/^[12]\d{3}$/.test(paper.year)) throw Error(`第 ${line} 行的年份应是四位数字或留空。`);
      paper.doi = normalizeDOI(paper.doi);
      if (!validDOI(paper.doi)) throw Error(`第 ${line} 行的 DOI 格式有误。未知时可留空。`);
      const doiKey = paper.doi.toLowerCase();
      if (doiKey && dois.has(doiKey)) throw Error(`第 ${line} 行的 DOI 重复，请合并对应文献。`);
      if (doiKey) dois.add(doiKey);
      return paper;
    });
  }

  function categoryCounts(papers, key) {
    const counts = new Map();
    for (const paper of papers) {
      const category = valueOf(paper, key);
      counts.set(category, (counts.get(category) || 0) + 1);
    }
    return counts;
  }

  function matchingPapers() {
    return catalog.filter(paper =>
      (!onlyMissingDOI || !paper.doi) &&
      (!query || [paper.title, paper.system, paper.topic, paper.doi, paper.note, paper.authors, paper.venue]
        .some(value => value?.toLowerCase().includes(query))) &&
      Object.keys(dimensions).every(key => !filters[key] || valueOf(paper, key) === filters[key]) &&
      drilldown.every(([key, value]) => valueOf(paper, key) === value)
    );
  }

  function notice(message, error = false) {
    const status = $('#pv-status');
    status.textContent = message;
    status.classList.toggle('error', error);
  }

  function refreshSource() {
    if (workspace.hidden) return;
    sourceBadge.textContent = catalog.length ? '我的文献 · 当前页面' : '0 篇文献';
  }

  function refreshFilters() {
    for (const select of workspace.querySelectorAll('[data-pv-filter]')) {
      const key = select.dataset.pvFilter;
      const values = [...categoryCounts(catalog, key).keys()].sort(compareText);
      if (key === 'year') values.reverse();
      select.innerHTML = '<option value="">全部</option>' +
        values.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join('');
      select.value = filters[key];
    }
    $('#pv-search').value = '';
  }

  function bars(papers, key) {
    const counts = [...categoryCounts(papers, key)];
    if (!counts.length) return '<p class="empty">当前筛选没有文献。</p>';
    counts.sort((a,b) => key === 'year' ? compareText(b[0], a[0]) : b[1] - a[1] || compareText(a[0], b[0]));
    const maxCount = Math.max(...counts.map(([,count]) => count));
    return `<div class="pv-bars">
      ${counts.slice(0, 8).map(([value,count]) => `<button class="pv-bar" type="button" data-pv-axis="${key}" data-pv-value="${esc(value)}" aria-label="${esc(value)}，${count} 篇，查看文献">
        <span>${esc(value)}</span><span class="pv-bar-track" aria-hidden="true"><i style="width:${count / maxCount * 100}%"></i></span><b>${count}</b>
      </button>`).join('')}
    </div>${counts.length > 8 ? '<p class="muted small">显示前 8 类，其余可在筛选中查看。</p>' : ''}`;
  }

  function overview(papers) {
    const topics = categoryCounts(papers.filter(paper => paper.topic), 'topic').size;
    return `<div class="cards" aria-label="当前筛选概览">
      <div class="card"><span>文献</span><div class="value">${papers.length}</div></div>
      <div class="card"><span>研究主题</span><div class="value">${topics}</div></div>
      <div class="card"><span>DOI 待补</span><div class="value">${papers.filter(paper => !paper.doi).length}</div></div>
    </div>
    <div class="pv-grid">
      <section class="panel"><h2>按发表年份</h2>${bars(papers, 'year')}</section>
      <section class="panel"><h2>按研究主题</h2>${bars(papers, 'topic')}</section>
    </div>`;
  }

  function chart(papers) {
    const options = active => Object.entries(dimensions).map(([key,label]) =>
      `<option value="${key}" ${key === active ? 'selected' : ''}>${label}</option>`
    ).join('');
    const cols = [...categoryCounts(papers, axisX).keys()].sort(compareText);
    const rowLabels = [...categoryCounts(papers, axisY).keys()].sort(compareText);
    const counts = new Map();
    for (const paper of papers) {
      const cell = JSON.stringify([valueOf(paper, axisY), valueOf(paper, axisX)]);
      counts.set(cell, (counts.get(cell) || 0) + 1);
    }
    const maxCount = Math.max(1, ...counts.values());
    let matrix = '<p class="empty">当前筛选没有文献。</p>';
    if (cols.length > 12 || rowLabels.length > 12) {
      matrix = '<p class="empty">当前某个维度超过 12 类。请选择更具体的筛选条件，或更换横轴、纵轴。</p>';
    } else if (papers.length) {
      matrix = `<div class="tablewrap" role="region" aria-label="交叉热图" tabindex="0"><table class="pv-matrix">
        <thead><tr><th scope="col">${dimensions[axisY]} / ${dimensions[axisX]}</th>${cols.map(x => `<th scope="col">${esc(x)}</th>`).join('')}</tr></thead>
        <tbody>${rowLabels.map(y => `<tr><th scope="row">${esc(y)}</th>${cols.map(x => {
          const count = counts.get(JSON.stringify([y, x])) || 0;
          return count ? `<td><button type="button" class="pv-heat" data-level="${Math.ceil(4 * count / maxCount)}"
            data-pv-axis="${axisX}" data-pv-value="${esc(x)}" data-pv-axis-y="${axisY}" data-pv-value-y="${esc(y)}"
            aria-label="${esc(y)}，${esc(x)}，${count} 篇，查看文献">${count}</button></td>`
            : '<td class="pv-zero">0</td>';
        }).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
    }
    return `<section class="panel pv-chart">
      <div class="pv-section-head"><h2>文献交叉分布</h2><p class="muted small">颜色越深，文献篇数越多。</p></div>
      <div class="pv-axis">
        <label>横轴<select id="pv-axis-x" aria-label="横轴">${options(axisX)}</select></label>
        <label>纵轴<select id="pv-axis-y" aria-label="纵轴">${options(axisY)}</select></label>
      </div>
      ${matrix}
    </section>`;
  }

  function paperList(papers) {
    const sorted = [...papers].sort(yearsFirst);
    const pageCount = Math.max(1, Math.ceil(sorted.length / pageSize));
    const visible = sorted.slice(pageIndex * pageSize, (pageIndex + 1) * pageSize);
    return `<section class="panel pv-chart">
      <div class="pv-section-head"><h2>${papers.length} 篇文献</h2>
        <button type="button" data-pv="missing" aria-pressed="${onlyMissingDOI}">${onlyMissingDOI ? '查看全部 DOI 状态' : '只看 DOI 待补'}</button>
      </div>
      ${visible.length ? `<div class="tablewrap" role="region" aria-label="文献清单" tabindex="0"><table class="pv-table">
        <thead><tr><th scope="col">文献标题</th><th scope="col">年份</th><th scope="col">材料体系</th><th scope="col">主题</th><th scope="col">DOI</th></tr></thead>
        <tbody>${visible.map(paper => `<tr>
          <td><button type="button" class="pv-paper-title" data-pv-paper="${paper.key}">${esc(paper.title)}</button></td>
          <td>${esc(paper.year || '—')}</td><td>${esc(paper.system || '—')}</td><td>${esc(paper.topic || '—')}</td>
          <td>${paper.doi ? `<a href="${esc(doiLink(paper.doi))}" target="_blank" rel="noopener noreferrer" aria-label="打开 ${esc(paper.title)} 的 DOI">打开原文</a>`
            : '<span class="pill warning">待补</span>'}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : '<p class="empty">没有符合当前筛选的文献。</p>'}
      ${pageCount > 1 ? `<div class="pv-pagination">
        <span class="muted">第 ${pageIndex + 1} / ${pageCount} 页</span>
        <div class="pv-actions"><button type="button" data-pv="prev" ${pageIndex === 0 ? 'disabled' : ''}>上一页</button>
        <button type="button" data-pv="next" ${pageIndex + 1 === pageCount ? 'disabled' : ''}>下一页</button></div>
      </div>` : ''}
    </section>`;
  }

  function renderResults() {
    workspace.querySelectorAll('[data-pv-view]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.pvView === view));
    });
    if (!catalog.length) {
      $('#pv-results').innerHTML = `
        <section class="panel pv-chart empty">
          <h2>暂无文献</h2>
          <p>按 DOI 查文献，或导入文献 CSV 开始。</p>
        </section>`;
      return;
    }
    const papers = matchingPapers();
    const drillLabel = drilldown.map(([key,value]) => `${dimensions[key]}：${value}`).join(' · ');
    $('#pv-results').innerHTML = `
      ${drillLabel ? `<div class="pv-chip"><span>${esc(drillLabel)}</span><button type="button" data-pv="undrill">移除图表筛选</button></div>` : ''}
      ${view === 'overview' ? overview(papers) : view === 'chart' ? chart(papers) : paperList(papers)}`;
  }

  function clearFilters() {
    for (const key of Object.keys(dimensions)) filters[key] = '';
    query = '';
    onlyMissingDOI = false;
    drilldown = [];
    pageIndex = 0;
    refreshFilters();
    renderResults();
  }

  function resetLookup() {
    lookupController?.abort();
    lookupController = null;
    lookupResult = null;
    lookupDialog.querySelector('[type="submit"]').disabled = false;
    $('#pv-lookup-status').textContent = '';
    $('#pv-lookup-preview').replaceChildren();
  }

  function openLookup(input = '', target = null) {
    if (dialog.open) dialog.close();
    lookupTarget = target;
    lookupDialog.innerHTML = `
      <h2 id="pv-lookup-title">按 DOI 查文献</h2>
      <p class="muted">向 Crossref 和 DataCite 查询公开文献资料。</p>
      <form>
        <label>DOI 或 doi.org 链接<input name="doi" value="${esc(input)}" placeholder="10.1038/s41560-021-00941-3" autocomplete="off" spellcheck="false" required></label>
        <div class="pv-actions">
          <button type="submit" class="primary">查询文献</button>
          <button type="button" data-pv-lookup-close>关闭</button>
        </div>
      </form>
      <p id="pv-lookup-status" role="status"></p>
      <section id="pv-lookup-preview" class="pv-lookup-preview"></section>`;
    lookupDialog.showModal();
    if (input.trim()) lookupDialog.querySelector('form').requestSubmit();
  }

  function lookupDestination(doi) {
    const existing = catalog.find(paper => paper.doi.toLowerCase() === doi.toLowerCase());
    if (lookupTarget && !catalog.includes(lookupTarget)) throw Error('文献列表已更新，请重新打开对应条目。');
    if (lookupTarget && existing && existing !== lookupTarget) throw Error('这个 DOI 已用于列表中的另一条文献。');
    return lookupTarget || existing;
  }

  function showLookupPreview(result) {
    const existing = lookupDestination(result.doi);
    $('#pv-lookup-preview').innerHTML = `
      <h3>${esc(result.title)}</h3>
      <dl>
        ${[['authors','作者'],['year','发表年份'],['venue','出版来源'],['registry','元数据来源']].map(([key,label]) =>
          `<dt>${label}</dt><dd>${esc(result[key] || '未返回')}</dd>`).join('')}
        <dt>DOI</dt><dd><a href="${esc(doiLink(result.doi))}" target="_blank" rel="noopener noreferrer">${esc(result.doi)}</a></dd>
      </dl>
      <div class="pv-lookup-fields">
        <label>材料体系（可选）<input id="pv-lookup-system" value="${esc(existing?.system)}"></label>
        <label>研究主题（可选）<input id="pv-lookup-topic" value="${esc(existing?.topic)}"></label>
      </div>
      <div class="pv-actions"><button type="button" class="primary" data-pv-lookup-apply>
        ${existing ? '更新文献资料' : '加入文献列表'}
      </button></div>`;
  }

  lookupDialog.addEventListener('input', event => {
    if (event.target.name === 'doi') resetLookup();
  });
  lookupDialog.addEventListener('close', () => {
    if (!lookupDialog.open) resetLookup();
  });
  lookupDialog.addEventListener('submit', async event => {
    event.preventDefault();
    resetLookup();
    const doi = normalizeDOI(new FormData(event.target).get('doi'));
    const status = $('#pv-lookup-status');
    if (!doi || !validDOI(doi)) {
      status.textContent = '请填写有效的 DOI 或 doi.org 链接。';
      return;
    }
    const controller = new AbortController();
    lookupController = controller;
    const search = event.target.querySelector('[type="submit"]');
    search.disabled = true;
    status.textContent = '正在查询文献资料…';
    const timeout = setTimeout(() => controller.abort(), 25000);
    try {
      const result = await lookupDOI(doi, controller.signal);
      if (!lookupDialog.open || lookupController !== controller) return;
      showLookupPreview(result);
      lookupResult = result;
      status.textContent = '已找到文献。核对后可保存到本页列表。';
    } catch (error) {
      if (lookupDialog.open && lookupController === controller) {
        status.textContent = controller.signal.aborted ? '查询超时，请重试。' : error.message;
      }
    } finally {
      clearTimeout(timeout);
      if (lookupController === controller) {
        lookupController = null;
        search.disabled = false;
      }
    }
  });
  lookupDialog.addEventListener('click', event => {
    if (event.target.closest('[data-pv-lookup-close]')) {
      lookupDialog.close();
      return;
    }
    if (!event.target.closest('[data-pv-lookup-apply]') || !lookupResult) return;
    try {
      const existing = lookupDestination(lookupResult.doi);
      if (!existing && catalog.length >= 500) {
        throw Error('当前列表已有 500 篇文献。可先导出，再导入另一批文献。');
      }
      const classification = {
        system:$('#pv-lookup-system').value.trim(),
        topic:$('#pv-lookup-topic').value.trim()
      };
      if (existing) {
        for (const [key,value] of Object.entries(lookupResult)) {
          if (value) existing[key] = value;
        }
        Object.assign(existing, classification);
      } else {
        catalog.push({key:catalog.length, note:'', source:'DOI 检索', ...lookupResult, ...classification});
      }
      lookupDialog.close();
      view = 'papers';
      clearFilters();
      refreshSource();
      workspace.querySelector('[data-pv="export"]').disabled = false;
      notice(existing ? '文献资料已更新。可导出 CSV 保存。' : '文献已加入列表。可导出 CSV 保存。');
    } catch (error) {
      $('#pv-lookup-status').textContent = error.message;
    }
  });

  function openPaper(key) {
    const paper = catalog.find(row => row.key === key);
    if (!paper) return;
    detailKey = key;
    dialog.innerHTML = `
      <h2 id="pv-detail-title">${esc(paper.title)}</h2>
      <dl>${Object.entries(dimensions).map(([field,label]) =>
        `<dt>${label}</dt><dd>${esc(valueOf(paper, field))}</dd>`).join('')}
        ${[['authors','作者'],['venue','出版来源'],['registry','元数据来源']].map(([field,label]) =>
          paper[field] ? `<dt>${label}</dt><dd>${esc(paper[field])}</dd>` : '').join('')}
        <dt>来源</dt><dd>${esc(paper.source)}</dd>
        <dt>DOI</dt><dd>${paper.doi ? `<a href="${esc(doiLink(paper.doi))}" target="_blank" rel="noopener noreferrer">${esc(paper.doi)}</a>` : '待补'}</dd>
        ${paper.note ? `<dt>备注</dt><dd>${esc(paper.note)}</dd>` : ''}
      </dl>
      <form id="pv-doi-form">
        <label>填写或更新 DOI<input name="doi" value="${esc(paper.doi)}" placeholder="可留空" autocomplete="off" spellcheck="false"></label>
        <p class="muted small">更改保留在当前页，导出 CSV 可保存。</p>
        <p id="pv-doi-error" role="alert"></p>
        <div class="pv-actions"><button type="submit" class="primary">保存 DOI</button>
          <button type="button" data-pv-lookup-record>查询 DOI 元数据</button>
          <button type="button" data-pv-close>关闭</button></div>
      </form>`;
    dialog.showModal();
  }

  dialog.addEventListener('click', event => {
    if (event.target.closest('[data-pv-close]')) dialog.close();
    if (event.target.closest('[data-pv-lookup-record]')) {
      const paper = catalog.find(row => row.key === detailKey);
      openLookup($('#pv-doi-form').elements.doi.value, paper);
    }
  });
  dialog.addEventListener('submit', event => {
    event.preventDefault();
    const doi = normalizeDOI(new FormData(event.target).get('doi'));
    const paper = catalog.find(row => row.key === detailKey);
    const duplicate = doi && catalog.some(row => row.key !== detailKey && row.doi.toLowerCase() === doi.toLowerCase());
    const error = !validDOI(doi) ? '请填写有效的 DOI 或留空。' : duplicate ? '该 DOI 已用于另一篇文献。' : '';
    if (error) {
      $('#pv-doi-error').textContent = error;
      return;
    }
    paper.doi = doi;
    dialog.close();
    pageIndex = 0;
    renderResults();
    notice('DOI 已更新。导出文献 CSV 可以保存更改。');
  });

  workspace.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    const {pv, pvView, pvAxis, pvValue, pvAxisY, pvValueY, pvPaper} = button.dataset;
    if (pvPaper !== undefined) {
      openPaper(Number(pvPaper));
      return;
    }
    if (pv === 'import') {
      $('#pv-file').click();
      return;
    }
    if (pv === 'lookup') {
      openLookup();
      return;
    }
    if (pv === 'template' || pv === 'export') {
      const lines = [csvEncode(Object.values(fields))];
      if (pv === 'export') {
        for (const paper of [...catalog].sort(yearsFirst)) {
          const values = Object.keys(fields).map(key => (paper[key] || '').replace(/^[=+\-@\t\r]/, char => "'" + char));
          lines.push(csvEncode(values));
        }
      }
      download('\uFEFF' + lines.join('\r\n') + '\r\n', pv === 'template' ? '钙钛矿文献模板.csv' : '钙钛矿文献.csv', 'text/csv;charset=utf-8');
      return;
    }
    if (pv === 'clear') {
      clearFilters();
      return;
    }
    if (pv === 'prev' || pv === 'next') {
      pageIndex += pv === 'prev' ? -1 : 1;
    } else {
      pageIndex = 0;
      if (pvView) {
        view = pvView;
        drilldown = [];
        onlyMissingDOI = false;
      }
      if (pvAxis) {
        drilldown = [[pvAxis, pvValue]];
        if (pvAxisY) drilldown.push([pvAxisY, pvValueY]);
        view = 'papers';
      }
      if (pv === 'undrill') drilldown = [];
      if (pv === 'missing') onlyMissingDOI = !onlyMissingDOI;
    }
    renderResults();
    if (pvAxis) workspace.querySelector('[data-pv-view="papers"]').focus();
    if (pv === 'prev' || pv === 'next' || pv === 'missing') {
      (workspace.querySelector(`[data-pv="${pv}"]:not(:disabled)`) || workspace.querySelector('[data-pv-view="papers"]')).focus();
    }
  });

  workspace.addEventListener('input', event => {
    if (event.target.id !== 'pv-search') return;
    query = event.target.value.trim().toLowerCase();
    pageIndex = 0;
    renderResults();
  });

  workspace.addEventListener('change', async event => {
    const input = event.target;
    if (input.dataset.pvFilter) {
      filters[input.dataset.pvFilter] = input.value;
      drilldown = [];
      pageIndex = 0;
      renderResults();
      return;
    }
    if (input.id === 'pv-axis-x' || input.id === 'pv-axis-y') {
      const oldX = axisX;
      const oldY = axisY;
      if (input.id === 'pv-axis-x') {
        axisX = input.value;
        if (axisX === axisY) axisY = oldX;
      } else {
        axisY = input.value;
        if (axisY === axisX) axisX = oldY;
      }
      renderResults();
      $('#' + input.id).focus();
      return;
    }
    if (input.id !== 'pv-file') return;
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    const requested = ++importVersion;
    try {
      if (!/\.csv$/i.test(file.name) || file.size > 2 * 1024 * 1024) throw Error('请选择不超过 2 MB 的 CSV。');
      const bytes = await file.arrayBuffer();
      if (requested !== importVersion) return;
      let text;
      try { text = new TextDecoder('utf-8', {fatal:true}).decode(bytes); }
      catch { text = new TextDecoder('gb18030', {fatal:true}).decode(bytes); }
      const next = parseCatalog(text, file.name);
      if (catalog.length && !confirm('导入新文件会替换本页文献。继续导入？')) return;
      catalog = next;
      view = 'overview';
      clearFilters();
      refreshSource();
      workspace.querySelector('[data-pv="export"]').disabled = false;
      notice(`已导入 ${next.length} 篇文献 · ${file.name}。文献保留在本页，导出 CSV 可保存。`);
    } catch (error) {
      if (requested === importVersion) notice(`导入失败：${error.message} 当前文献已保留。`, true);
    }
  });

  refreshFilters();
  renderResults();
  refreshSource();
  return refreshSource;
}

const standaloneCatalogRoot = $('#pv-standalone-root');
if (standaloneCatalogRoot) mountPerovskiteCatalog(standaloneCatalogRoot, $('#pv-standalone-source'));
</script>
</body>
</html>
